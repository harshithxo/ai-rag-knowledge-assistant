
services:
  - type: web
    name: docmind
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Application
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10

      # Supabase PostgreSQL
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: DATABASE_SSLROOTCERT
        value: certs/prod-ca-2021.crt
      - key: DATABASE_POOL_MAX
        value: "5"

      # Vector database
      - key: VECTOR_DIMENSIONS
        value: "768"

      # Supabase Storage (S3)
      - key: UPLOAD_STORAGE
        value: s3
      - key: S3_BUCKET
        value: documents
      - key: S3_REGION
        value: eu-north-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Gemini Chat
      - key: AI_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_API_KEY
        sync: false

      # Gemini Embeddings
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_API_KEY
        sync: false

      # Application Security
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Email Verification
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
