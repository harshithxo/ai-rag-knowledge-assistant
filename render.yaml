services:
  - type: web
    name: docmind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: DATABASE_SSLROOTCERT
        value: certs/prod-ca-2021.crt
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: VECTOR_DIMENSIONS
        value: "768"
      - key: UPLOAD_STORAGE
        value: s3
      - key: S3_REGION
        value: eu-north-1
      - key: EMAIL_PROVIDER
        value: resend
      - key: AI_PROVIDER
        value: openai-compatible
      - key: EMBEDDING_PROVIDER
        value: openai-compatible
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LLM_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
